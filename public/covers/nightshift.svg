<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#15181D"/>

  <!-- spotlight cone -->
  <polygon points="400,0 260,600 540,600" fill="#E8A33D" opacity="0.08"/>
  <polygon points="400,0 320,600 480,600" fill="#E8A33D" opacity="0.1"/>

  <!-- stage floor -->
  <rect x="0" y="480" width="800" height="120" fill="#1A1E24"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#2B2F36" stroke-width="2"/>

  <!-- mic stand -->
  <line x1="400" y1="220" x2="400" y2="470" stroke="#A7A79F" stroke-width="6"/>
  <line x1="340" y1="470" x2="460" y2="470" stroke="#A7A79F" stroke-width="6"/>
  <line x1="400" y1="440" x2="360" y2="470" stroke="#A7A79F" stroke-width="6"/>
  <line x1="400" y1="440" x2="440" y2="470" stroke="#A7A79F" stroke-width="6"/>
  <ellipse cx="400" cy="210" rx="26" ry="34" fill="#0F1216" stroke="#ECEAE4" stroke-width="3"/>
  <line x1="400" y1="180" x2="400" y2="150" stroke="#A7A79F" stroke-width="5"/>

  <!-- sound waves, violet accent -->
  <g stroke="#7C6FFF" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 460 200 Q 490 210 460 220"/>
    <path d="M 485 185 Q 530 210 485 235"/>
    <path d="M 510 170 Q 570 210 510 250"/>
  </g>
  <g stroke="#7C6FFF" stroke-width="3" fill="none" opacity="0.8" transform="scale(-1,1) translate(-800,0)">
    <path d="M 460 200 Q 490 210 460 220"/>
    <path d="M 485 185 Q 530 210 485 235"/>
    <path d="M 510 170 Q 570 210 510 250"/>
  </g>

  <!-- amp silhouettes -->
  <rect x="130" y="380" width="140" height="100" rx="4" fill="#22262E" stroke="#2B2F36" stroke-width="2"/>
  <circle cx="200" cy="430" r="34" fill="#0F1216" stroke="#2B2F36" stroke-width="2"/>
  <rect x="530" y="380" width="140" height="100" rx="4" fill="#22262E" stroke="#2B2F36" stroke-width="2"/>
  <circle cx="600" cy="430" r="34" fill="#0F1216" stroke="#2B2F36" stroke-width="2"/>
</svg>
