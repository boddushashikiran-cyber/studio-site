<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#1A1E24"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#grain)" opacity="0.4"/>

  <!-- corkboard -->
  <rect x="140" y="90" width="520" height="380" rx="4" fill="#22262E" stroke="#2B2F36" stroke-width="2"/>

  <!-- pinned notes -->
  <g>
    <rect x="185" y="140" width="130" height="100" fill="#0F1216" stroke="#2B2F36" stroke-width="1.5" transform="rotate(-4 250 190)"/>
    <circle cx="250" cy="150" r="5" fill="#E8A33D" transform="rotate(-4 250 190)"/>
    <line x1="205" y1="175" x2="295" y2="175" stroke="#A7A79F" stroke-width="2" transform="rotate(-4 250 190)"/>
    <line x1="205" y1="195" x2="280" y2="195" stroke="#A7A79F" stroke-width="2" transform="rotate(-4 250 190)"/>
    <line x1="205" y1="215" x2="290" y2="215" stroke="#A7A79F" stroke-width="2" transform="rotate(-4 250 190)"/>
  </g>

  <g>
    <rect x="345" y="150" width="130" height="100" fill="#0F1216" stroke="#2B2F36" stroke-width="1.5" transform="rotate(3 410 200)"/>
    <circle cx="410" cy="160" r="5" fill="#7C6FFF" transform="rotate(3 410 200)"/>
    <line x1="365" y1="185" x2="455" y2="185" stroke="#A7A79F" stroke-width="2" transform="rotate(3 410 200)"/>
    <line x1="365" y1="205" x2="440" y2="205" stroke="#A7A79F" stroke-width="2" transform="rotate(3 410 200)"/>
    <line x1="365" y1="225" x2="450" y2="225" stroke="#A7A79F" stroke-width="2" transform="rotate(3 410 200)"/>
  </g>

  <g>
    <rect x="500" y="130" width="120" height="95" fill="#0F1216" stroke="#2B2F36" stroke-width="1.5" transform="rotate(-2 560 177)"/>
    <circle cx="560" cy="140" r="5" fill="#E8A33D" transform="rotate(-2 560 177)"/>
    <line x1="518" y1="163" x2="600" y2="163" stroke="#A7A79F" stroke-width="2" transform="rotate(-2 560 177)"/>
    <line x1="518" y1="183" x2="588" y2="183" stroke="#A7A79F" stroke-width="2" transform="rotate(-2 560 177)"/>
  </g>

  <g>
    <rect x="220" y="290" width="130" height="100" fill="#0F1216" stroke="#2B2F36" stroke-width="1.5" transform="rotate(2 285 340)"/>
    <circle cx="285" cy="300" r="5" fill="#7C6FFF" transform="rotate(2 285 340)"/>
    <line x1="240" y1="325" x2="330" y2="325" stroke="#A7A79F" stroke-width="2" transform="rotate(2 285 340)"/>
    <line x1="240" y1="345" x2="315" y2="345" stroke="#A7A79F" stroke-width="2" transform="rotate(2 285 340)"/>
  </g>

  <g>
    <rect x="400" y="300" width="130" height="100" fill="#0F1216" stroke="#2B2F36" stroke-width="1.5" transform="rotate(-3 465 350)"/>
    <circle cx="465" cy="310" r="5" fill="#E8A33D" transform="rotate(-3 465 350)"/>
    <line x1="420" y1="335" x2="510" y2="335" stroke="#A7A79F" stroke-width="2" transform="rotate(-3 465 350)"/>
    <line x1="420" y1="355" x2="495" y2="355" stroke="#A7A79F" stroke-width="2" transform="rotate(-3 465 350)"/>
    <line x1="420" y1="375" x2="500" y2="375" stroke="#A7A79F" stroke-width="2" transform="rotate(-3 465 350)"/>
  </g>

  <!-- magnifying glass, amber accent, the "search/find" motif -->
  <g transform="translate(560,380)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#E8A33D" stroke-width="6"/>
    <line x1="40" y1="40" x2="85" y2="85" stroke="#E8A33D" stroke-width="8" stroke-linecap="round"/>
  </g>

  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#1A1E24"/>
    </pattern>
  </defs>
</svg>
